<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Orbit</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link rel="stylesheet" href="taskpane.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">
                <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Finoco
            </h1>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Context Display -->
        <div class="context-panel" id="contextPanel">
            <div class="context-item">
                <span class="context-label">Workbook:</span>
                <span class="context-value" id="workbookName">-</span>
            </div>
            <div class="context-item">
                <span class="context-label">Sheet:</span>
                <span class="context-value" id="sheetName">-</span>
            </div>
            <div class="context-item">
                <span class="context-label">Selection:</span>
                <span class="context-value" id="selectionRange">-</span>
                <button id="refreshButton" class="refresh-button" title="Refresh selection">🔄</button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <div class="welcome-icon">👋</div>
                <h2>Welcome to Excel AI Agent</h2>
                <p>Select cells and ask me to help with:</p>
                <ul>
                    <li>Data analysis and insights</li>
                    <li>Formula suggestions</li>
                    <li>Data transformations</li>
                    <li>Creating summaries</li>
                    <li>And much more!</li>
                </ul>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea
                    id="userInput"
                    class="user-input"
                    placeholder="Ask me anything about your data..."
                    rows="1"
                ></textarea>
                <button id="sendButton" class="send-button" title="Send message">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Main script with ES6 module support -->
    <script type="module" src="src/taskpane.js"></script>
</body>
</html>
