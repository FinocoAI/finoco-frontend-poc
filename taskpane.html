<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warren by Finoco.ai</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="taskpane.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="app-title">Warren</h1>
            <div class="header-actions">
                <button id="historyButton" class="icon-button" title="History">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>History</span>
                </button>
                <button id="menuButton" class="icon-button" title="Menu">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="6" r="1.5" fill="currentColor"/>
                        <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                        <circle cx="12" cy="18" r="1.5" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Context Display -->
        <div class="context-panel" id="contextPanel">
            <div class="context-item">
                <span class="context-label">Workbook:</span>
                <span class="context-value" id="workbookName">-</span>
            </div>
            <div class="context-item">
                <span class="context-label">Sheet:</span>
                <span class="context-value" id="sheetName">-</span>
            </div>
            <div class="context-item">
                <span class="context-label">Selection:</span>
                <span class="context-value" id="selectionRange">-</span>
                <button id="refreshButton" class="refresh-button" title="Refresh selection">🔄</button>
            </div>
            <!-- Quick Action Buttons -->
            <div class="context-item" style="margin-top: 8px;">
                <div class="quick-actions">
                    <button id="traceDependenciesBtn" class="quick-action-btn hidden" title="Show dependency graph for this cell">
                        📊 Trace
                    </button>
                    <button id="findErrorsBtn" class="quick-action-btn" title="Find all errors in worksheet">
                        ⚠️ Find Errors
                    </button>
                    <button id="findCircularRefsBtn" class="quick-action-btn" title="Detect circular references">
                        🔄 Circular Refs
                    </button>
                </div>
            </div>
        </div>

        <!-- Status Indicator (minimal, bottom left) -->
        <div class="status-indicator hidden">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
        </div>

        <!-- Chat Messages -->
        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h2 class="welcome-title">AI that Understands<br>your Spreadsheets</h2>
                
                <div class="suggestions-section">
                    <h3 class="suggestions-title">Try these suggestions</h3>
                    <button class="suggestion-item" data-query="What are the headwinds for Tata Motors">
                        <span>What are the headwinds for Tata Motors</span>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="suggestion-item" data-query="When is the best time to enter?">
                        <span>When is the best time to enter?</span>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="suggestion-item" data-query="Analyze the revenue trends in my data">
                        <span>Analyze the revenue trends in my data</span>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <button id="uploadButton" class="upload-button">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Upload file</span>
                </button>
                <textarea
                    id="userInput"
                    class="user-input"
                    placeholder="How can I help you today?"
                    rows="1"
                ></textarea>
                <button id="sendButton" class="send-button" title="Send message">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Clarification Modal -->
        <div id="clarificationModal" class="clarification-modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-icon">❓</div>
                    <h3>I need clarification</h3>
                </div>
                <div class="modal-body">
                    <p id="clarificationQuestion" class="clarification-question"></p>
                    <textarea
                        id="clarificationInput"
                        class="clarification-input"
                        placeholder="Type your answer here..."
                        rows="3"
                    ></textarea>
                </div>
                <div class="modal-footer">
                    <button id="clarificationSubmit" class="btn-primary">Submit</button>
                    <button id="clarificationCancel" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Overwrite Approval Modal -->
        <div id="overwriteModal" class="clarification-modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-icon" style="background: #f59e0b;">⚠️</div>
                    <h3>Confirm Overwrite</h3>
                </div>
                <div class="modal-body">
                    <p id="overwriteMessage" class="clarification-question"></p>
                    <div id="overwriteDetails" class="overwrite-details" style="margin-top: 12px; padding: 12px; background: #f3f4f6; border-radius: 6px; font-size: 13px; color: #374151;"></div>
                </div>
                <div class="modal-footer">
                    <button id="overwriteApprove" class="btn-primary" style="background: #f59e0b;">Overwrite Data</button>
                    <button id="overwriteCancel" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Dependency Graph Modal -->
        <div id="dependencyModal" class="dependency-modal hidden">
            <div class="modal-overlay"></div>
            <div class="dependency-modal-content">
                <button id="dependencyModalClose" class="dependency-close-btn" title="Close">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="dependency-modal-body">
                    <!-- Content inserted by displayDependencyGraph tool -->
                </div>
            </div>
        </div>

        <!-- Edit Preview & Approval Modal -->
        <div id="editPreviewModal" class="edit-preview-modal hidden">
            <div class="modal-overlay"></div>
            <div class="edit-preview-content">
                <div class="modal-header">
                    <div class="modal-icon" style="background: #3b82f6;">📝</div>
                    <div style="flex: 1;">
                        <h3 id="editOperationType" style="margin: 0; font-size: 16px;">Preview Changes</h3>
                        <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
                            <span style="font-size: 12px; color: #9ca3af;">Sheet:</span>
                            <span id="editSheetName" style="font-size: 14px; font-weight: 600; color: #3b82f6; background: #eff6ff; padding: 4px 12px; border-radius: 6px;"></span>
                        </div>
                        <p id="editRangeInfo" style="margin: 6px 0 0 0; font-size: 12px; color: #6b7280; font-weight: normal;"></p>
                    </div>
                </div>
                <div class="modal-body">
                    <!-- Warning for overwrites -->
                    <div id="editWarning"></div>
                    
                    <!-- Preview Table (larger area with scroll) -->
                    <div id="editPreviewTable" class="preview-table-container">
                        <!-- Table content inserted dynamically -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="editApprove" class="btn-primary">
                        ✓ Approve & Write
                    </button>
                    <button id="editReject" class="btn-secondary">
                        ✗ Reject
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main script with ES6 module support -->
    <script type="module" src="src/taskpane.js"></script>
</body>
</html>
